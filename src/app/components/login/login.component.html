<div class="login-container">
  <mat-card>
    <mat-card-title>LexTiming</mat-card-title>
    <mat-card-subtitle>Iniciar Sesión</mat-card-subtitle>
    <mat-card-content>
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email</mat-label>
          <input matInput type="email" formControlName="email">
          <mat-error *ngIf="loginForm.get('email')?.hasError('required')">Email es obligatorio</mat-error>
          <mat-error *ngIf="loginForm.get('email')?.hasError('email')">Email inválido</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Contraseña</mat-label>
          <input matInput type="password" formControlName="password">
          <mat-error>Contraseña es obligatoria</mat-error>
        </mat-form-field>

        <button mat-raised-button color="primary" type="submit" [disabled]="loading || loginForm.invalid" class="full-width">
          {{ loading ? 'Cargando...' : 'Ingresar' }}
        </button>
      </form>
    </mat-card-content>
    <mat-card-actions>
      <a routerLink="/register">¿No tenés cuenta? Registrate</a>
    </mat-card-actions>
  </mat-card>
</div>
