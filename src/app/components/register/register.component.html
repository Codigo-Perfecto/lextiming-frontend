<div class="register-container">
  <mat-card>
    <mat-card-title>LexTiming</mat-card-title>
    <mat-card-subtitle>Registro de Abogado</mat-card-subtitle>
    <mat-card-content>
      <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
        <div class="row">
          <mat-form-field appearance="outline" class="half-width">
            <mat-label>Nombre</mat-label>
            <input matInput formControlName="firstName">
            <mat-error>Nombre es obligatorio</mat-error>
          </mat-form-field>

          <mat-form-field appearance="outline" class="half-width">
            <mat-label>Apellido</mat-label>
            <input matInput formControlName="lastName">
            <mat-error>Apellido es obligatorio</mat-error>
          </mat-form-field>
        </div>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email</mat-label>
          <input matInput type="email" formControlName="email">
          <mat-error *ngIf="registerForm.get('email')?.hasError('required')">Email es obligatorio</mat-error>
          <mat-error *ngIf="registerForm.get('email')?.hasError('email')">Email inválido</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Contraseña</mat-label>
          <input matInput type="password" formControlName="password">
          <mat-error *ngIf="registerForm.get('password')?.hasError('required')">Contraseña es obligatoria</mat-error>
          <mat-error *ngIf="registerForm.get('password')?.hasError('minlength')">Mínimo 6 caracteres</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Matrícula</mat-label>
          <input matInput formControlName="barNumber">
          <mat-error>Matrícula es obligatoria</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Teléfono</mat-label>
          <input matInput formControlName="phone">
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Estudio Jurídico</mat-label>
          <input matInput formControlName="lawFirm">
        </mat-form-field>

        <button mat-raised-button color="primary" type="submit" [disabled]="loading || registerForm.invalid" class="full-width">
          {{ loading ? 'Cargando...' : 'Registrarse' }}
        </button>
      </form>
    </mat-card-content>
    <mat-card-actions>
      <a routerLink="/login">¿Ya tenés cuenta? Iniciá sesión</a>
    </mat-card-actions>
  </mat-card>
</div>
